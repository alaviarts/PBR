<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title"><title id="title">Three broad research commitments: inquiry, rigor and evidence</title><rect x="1" y="1" width="1198" height="228" rx="18" fill="#111b2b" stroke="#344455"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="43" font-size="14" letter-spacing="3" fill="#a3b4c4">RESEARCH COMMITMENTS</text><g fill="#e9eff5" font-size="29" font-weight="600"><text x="44" y="109">Inquiry</text><text x="443" y="109">Rigor</text><text x="840" y="109">Evidence</text></g><g fill="#b1c2d1" font-size="17"><text x="44" y="147">Ask clear questions.</text><text x="443" y="147">Build with discipline.</text><text x="840" y="147">Evaluate with care.</text></g><g stroke="#506072"><path d="M401 76 V175 M800 76 V175"/></g><g fill="#d6ae78"><circle cx="44" cy="187" r="3"/><circle cx="443" cy="187" r="3"/><circle cx="840" cy="187" r="3"/></g></g></svg>
